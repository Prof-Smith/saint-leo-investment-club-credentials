<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Revocation Policy</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header><h1>Revocation Policy</h1></header><main class="wrap"><section class="card"><p>A credential may be revoked for falsified attendance, fabricated or altered evidence, plagiarism, misuse of another credential ID, or material issuance error. The public record should display Revoked without disclosing private disciplinary details.</p></section></main></body></html>
