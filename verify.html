<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify a Credential | Saint Leo Investment Club</title><link rel="stylesheet" href="assets/css/style.css?v=34"></head><body><header class="site-header"><h1>Credential Verification</h1><p>Saint Leo Investment Club</p><a class="header-verify" href="index.html">Credential pathway</a></header><main><section class="verify-page"><span class="eyebrow">Public verification</span><h2>Enter a credential ID</h2><p>Use the complete ID printed on the credential, including hyphens.</p><form class="verify-form" id="verify-form"><label class="sr-only" for="credential-id">Credential ID</label><input id="credential-id" type="text" placeholder="Example: SLIC-NET-2027-001" autocomplete="off" required><button type="submit">Verify credential</button></form><p class="verify-note">Examples in this repository: SLIC-NET-2027-001 and SLIC-CMS-2027-001.</p></section></main><script>document.getElementById('verify-form').addEventListener('submit',function(e){e.preventDefault();const id=document.getElementById('credential-id').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');if(id){location.href='credentials/'+encodeURIComponent(id)+'.html';}});</script></body></html>
