name: Generate credential pages

on:
  push:
    branches:
      - main
    paths:
      - sample-data/approved-credential.csv
      - scripts/generate_credential.py
      - templates/credential-template.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-credential-pages
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install qrcode pillow

      - name: Generate credential pages
        env:
          BASE_URL: https://prof-smith.github.io/saint-leo-investment-club-credentials
        run: |
          python scripts/generate_credential.py \
            sample-data/approved-credential.csv

      - name: Commit generated files
        run: |
          git add credentials assets/qr

          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Generate credential verification pages"
          git push
