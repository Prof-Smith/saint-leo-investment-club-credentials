<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credential Not Found</title><link rel="stylesheet" href="assets/css/style.css?v=36"></head><body class="verification-body"><header class="verification-header"><a class="brand" href="index.html">Saint Leo Investment Club</a><a class="header-verify" href="verify.html">Verify another credential</a></header><main class="verification-main"><section class="verify-page"><div class="verified-pill" style="background:#fff0e8;color:#913a16;border-color:#efb59a">Record not found</div><h2>No matching public credential was found</h2><p>Check the credential ID, including all hyphens, and try again.</p><form class="verify-form" id="verify-form"><label class="sr-only" for="credential-id">Credential ID</label><input id="credential-id" type="text" placeholder="Example: SLIC-NET-2027-001" required><button type="submit">Verify credential</button></form></section></main><script>document.getElementById('verify-form').addEventListener('submit',function(e){e.preventDefault();const id=document.getElementById('credential-id').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');if(id){location.href='credentials/'+encodeURIComponent(id)+'.html';}});</script></body></html>
